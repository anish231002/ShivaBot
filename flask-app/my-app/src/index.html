<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VideoBot - Talk with Chatrapati Shivaji Maharaj</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="./src/app.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="avatar-header">🤖</div>
        <div class="status-dot connected"></div>
        <h1>AI VideoBot</h1>
        <span>•</span>
        <p>Talk with Chatrapati Shivaji Maharaj</p>
        <div class="status-dot connected"></div>
      </div>
      <div class="header-right">
        <div class="status-dot connected"></div>
        <span>Connected</span>
        <span class="material-icons">dark_mode</span>
        <span>Dark</span>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Video Section -->
      <section class="video-section">
        <!-- User Video Preview -->
        <div class="user-video-preview">
          <span class="material-icons">person</span>
          <span>You</span>
        </div>

        <!-- Main Video Area -->
        <div class="main-video-area">
          <div class="main-video-placeholder">
            <!-- Avatar image will be here -->
          </div>
          <button class="ai-powered-avatar-btn">AI-Powered Avatar</button>
        </div>
      </section>

      <!-- Chat Section -->
      <section class="chat-section">
        <!-- Chat Header -->
        <div class="chat-header">
          <span class="material-icons">chat</span>
          <h2>Chat</h2>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages">
          <div class="message">
            <div class="avatar-chat">M</div>
            <div>
              <p>Jay Maharashtra! I am Chhatrapati Shivaji Maharaj. How may I be of service to you today?</p>
              <span>12:29</span>
            </div>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input">
          <input type="text" placeholder="Type your message...">
          <button>
            <span class="material-icons">mic</span>
          </button>
          <button>
            <span class="material-icons">send</span>
          </button>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
